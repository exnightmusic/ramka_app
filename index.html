<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор рамок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
            --text-main: var(--tg-theme-text-color, #ffffff);
            --text-muted: var(--tg-theme-hint-color, #888888);
            --border-color: #444444;
            --accent: var(--tg-theme-link-color, #0ea5e9);
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; font-family: sans-serif; background: var(--bg-color); color: var(--text-main); }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 20px; margin: 0; }
        .settings-btn { background: none; border: none; color: var(--text-main); font-size: 22px; }
        .shape-btn { padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); margin-bottom: 10px; width: 100%; }
        .shape-btn.active { background: var(--accent); color: black; }
        .preview-box { background: var(--card-bg); height: 280px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .preview-box svg { width: 100%; height: 100%; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); font-size: 16px; }
        .results-card { background: var(--card-bg); padding: 20px; border-radius: 16px; display: none; }
        .results-card.active { display: block; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .result-value { font-weight: bold; }
        .hint { font-size: 12px; color: var(--text-muted); margin-top: 15px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); padding: 20px; border-radius: 16px; width: 100%; max-width: 340px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Калькулятор рамок</h1>
        <button class="settings-btn" onclick="openSettings()">⋮</button>
    </div>

    <button class="shape-btn active" onclick="selectShape('rightTriangle')">Прямоугольный треугольник</button>

    <div class="preview-box" id="previewBox">Введите размеры стекла</div>

    <div class="inputs-container" id="inputsContainer"></div>

    <div class="results-card" id="resultsCard">
        <div class="results-title" style="margin-bottom: 15px; font-weight: bold;">Размеры рамки</div>
        <div class="results-sub" id="resultsSub" style="margin-bottom: 15px; font-size: 12px; color: var(--text-muted);"></div>
        <div id="resultsList"></div>
        <div class="hint">* Для запила в стык (угол/2) используйте половину указанного угла.</div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>Настройки</h2>
            <div class="input-group">
                <label>Фальц (отступ от края), мм</label>
                <input type="number" id="inputFalz" value="10.0" step="0.1" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Смещение пилы (припуск), мм</label>
                <input type="number" id="inputPila" value="22.0" step="0.1" oninput="calculate()">
            </div>
            <button onclick="closeSettings()" style="width: 100%; padding: 10px; margin-top: 10px; background: var(--accent); color: black; border: none; border-radius: 8px;">Сохранить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        let settings = { falz: 10.0, pila: 22.0 };
        let currentShape = 'rightTriangle';

        function loadSettings() {
            try {
                const saved = localStorage.getItem('glassSettings');
                if (saved) settings = JSON.parse(saved);
            } catch(e) {}
            document.getElementById('inputFalz').value = settings.falz;
            document.getElementById('inputPila').value = settings.pila;
        }

        function saveSettings() {
            settings.falz = parseFloat(document.getElementById('inputFalz').value) || 10.0;
            settings.pila = parseFloat(document.getElementById('inputPila').value) || 22.0;
            localStorage.setItem('glassSettings', JSON.stringify(settings));
            closeSettings();
            calculate();
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
        function selectShape(shape) { currentShape = shape; renderInputs(); calculate(); }

        function renderInputs() {
            const container = document.getElementById('inputsContainer');
            container.innerHTML = `
                <div class="input-group"><label>Горизонтальный катет (мм)</label><input type="number" id="inp1" oninput="calculate()"></div>
                <div class="input-group"><label>Вертикальный катет (мм)</label><input type="number" id="inp2" oninput="calculate()"></div>
            `;
        }

        const r = (num) => Math.round(num * 10) / 10;
        const r2d = (rad) => rad * 180 / Math.PI;

        function calculate() {
            const falz = settings.falz;
            const pila = settings.pila;
            const a = parseFloat(document.getElementById('inp1')?.value) || 0;
            const b = parseFloat(document.getElementById('inp2')?.value) || 0;

            let results = [];
            let valid = false;

            if (a > 0 && b > 0) {
                valid = true;
                
                // Углы
                const alpha = r2d(Math.atan(b / a)); 
                const beta = 90 - alpha;

                // Чистая геометрия: линии смещаются на 10 мм внутрь
                // Для катета А (низ): отступ слева (45°) и справа (угол beta)
                const shiftA_left = falz / Math.tan(45 * Math.PI / 180);
                const shiftA_right = falz / Math.tan(beta * Math.PI / 180);
                const frameA_raw = a - shiftA_left - shiftA_right;

                // Для катета B (бок): отступ снизу (45°) и сверху (угол alpha)
                const shiftB_bottom = falz / Math.tan(45 * Math.PI / 180);
                const shiftB_top = falz / Math.tan(alpha * Math.PI / 180);
                const frameB_raw = b - shiftB_bottom - shiftB_top;

                // Для гипотенузы: отступ с двух сторон (углы alpha и beta)
                const shiftC_1 = falz / Math.sin(alpha * Math.PI / 180);
                const shiftC_2 = falz / Math.sin(beta * Math.PI / 180);
                const frameC_raw = Math.sqrt(a*a + b*b) - shiftC_1 - shiftC_2;

                results = [
                    { label: 'Катет A (низ)', val: frameA_raw + pila, angle: 45 },
                    { label: 'Гипотенуза', val: frameC_raw + pila, angle: alpha },
                    { label: 'Катет B (бок)', val: frameB_raw + pila, angle: 90 }
                ];

                // Отрисовка
                const scale = Math.min(150/a, 160/b, 2);
                const w = a * scale, hh = b * scale;
                const cx = 150, cy = 130;
                const x1 = cx - w/2, x2 = cx + w/2, y1 = cy + hh/2, y2 = cy - hh/2;

                document.getElementById('previewBox').innerHTML = `
                    <svg viewBox="0 0 300 240">
                        <path d="M ${x1} ${y1} L ${x2} ${y1} L ${x1} ${y2} Z" fill="none" stroke="#888" stroke-width="4"/>
                        <text x="${cx}" y="${y1 - 8}" fill="#22c55e" font-size="13" text-anchor="middle">Р:${r(frameA_raw+pila)}</text>
                        <text x="${cx - w/4}" y="${cy + 15}" fill="#22c55e" font-size="13" text-anchor="middle" transform="rotate(${-alpha} ${cx - w/4} ${cy + 15})">Р:${r(frameC_raw+pila)}</text>
                        <text x="${x1 + 20}" y="${cy}" fill="#22c55e" font-size="13" text-anchor="middle" transform="rotate(-90 ${x1 + 20} ${cy})">Р:${r(frameB_raw+pila)}</text>
                    </svg>
                `;
            }

            const card = document.getElementById('resultsCard');
            const list = document.getElementById('resultsList');
            const sub = document.getElementById('resultsSub');

            if (!valid) {
                document.getElementById('previewBox').innerHTML = 'Введите размеры стекла';
                card.classList.remove('active');
                return;
            }

            card.classList.add('active');
            sub.innerText = `Фальц: ${falz.toFixed(1)} мм + пила: ${pila.toFixed(1)} мм`;
            
            list.innerHTML = '';
            results.forEach(res => {
                list.innerHTML += `
                    <div class="result-item">
                        <div>${res.label}</div>
                        <div style="text-align: right;">
                            <div class="result-value">${res.val.toFixed(1)} мм</div>
                            <div style="font-size: 12px; color: var(--text-muted);">Угол: ${res.angle.toFixed(1)}°</div>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = () => {
            loadSettings();
            renderInputs();
        };
    </script>
</body>
</html>
