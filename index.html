<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор рамок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
            --text-main: var(--tg-theme-text-color, #ffffff);
            --text-muted: var(--tg-theme-hint-color, #888888);
            --border-color: #444444;
            --accent: var(--tg-theme-link-color, #0ea5e9);
            --gradient: linear-gradient(135deg, #0ea5e9, #a855f7);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        .header h1 { font-size: 20px; font-weight: 800; margin: 0; }
        .settings-btn { background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; }

        .shapes-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .shapes-scroll::-webkit-scrollbar { display: none; }
        .shape-btn {
            flex: 0 0 60px; height: 60px; background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; color: var(--text-muted);
        }
        .shape-btn.active { background: rgba(14,165,233,0.1); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(14,165,233,0.2); }
        .shape-btn svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2; }

        .preview-box {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; height: 280px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px; position: relative; overflow: hidden;
        }
        .preview-box svg { width: 100%; height: 100%; }
        
        .svg-text-size { font-family: sans-serif; fill: #22c55e; font-size: 13px; font-weight: bold; }
        .svg-text-angle { font-family: sans-serif; fill: var(--text-muted); font-size: 11px; }

        .inputs-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; position: relative; }
        .input-group label {
            position: absolute; top: -8px; left: 10px; background: var(--bg-color);
            padding: 0 4px; font-size: 12px; color: var(--text-muted);
        }
        .input-group input {
            width: 100%; background: transparent; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 16px;
            outline: none; font-family: inherit; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); }

        .results-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 20px; display: none;
        }
        .results-card.active { display: block; }
        .results-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .results-title { font-size: 16px; font-weight: bold; color: var(--text-muted); }
        .results-save { font-size: 14px; color: #22c55e; cursor: pointer; background: none; border: none; }
        .results-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; }

        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .result-item:last-child { border-bottom: none; padding-bottom: 0; }
        .result-label { font-size: 14px; color: var(--text-muted); }
        .result-value { font-size: 16px; font-weight: bold; text-align: right; color: var(--text-main); }
        .result-angle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .hint { font-size: 12px; color: var(--text-muted); margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(128,128,128,0.1); line-height: 1.4; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); border: 1px solid rgba(128,128,128,0.1); width: 100%; max-width: 340px; border-radius: 20px; padding: 20px; }
        .modal h2 { margin: 0 0 20px 0; font-size: 18px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-text { background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; }
        .btn-save { background: var(--gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Калькулятор рамок</h1>
        <button class="settings-btn" onclick="openSettings()">⋮</button>
    </div>

    <div class="shapes-scroll" id="shapesContainer">
        <div class="shape-btn active" data-shape="trapezoid" onclick="selectShape('trapezoid')">
            <svg viewBox="0 0 24 24"><path d="M4 6 L20 6 L16 18 L8 18 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="triangle" onclick="selectShape('triangle')">
            <svg viewBox="0 0 24 24"><path d="M12 4 L20 20 L4 20 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="rightTriangle" onclick="selectShape('rightTriangle')">
            <svg viewBox="0 0 24 24"><path d="M4 4 L4 20 L20 20 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="oneSlant" onclick="selectShape('oneSlant')">
            <svg viewBox="0 0 24 24"><path d="M4 6 L16 6 L20 18 L4 18 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="rhombus" onclick="selectShape('rhombus')">
            <svg viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z"/></svg>
        </div>
    </div>

    <div class="preview-box" id="previewBox">
        Введите размеры стекла
    </div>

    <div class="inputs-container" id="inputsContainer"></div>

    <div class="results-card" id="resultsCard">
        <div class="results-header">
            <div class="results-title">Размеры рамки</div>
            <button class="results-save" onclick="copyResults()">Сохранить</button>
        </div>
        <div class="results-sub" id="resultsSub">Фальц 10.0 мм + запил 22.0 мм</div>
        <div id="resultsList"></div>
        <div class="hint">* Для запила в стык (угол/2) используйте половину указанного угла.</div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>Настройки калькулятора</h2>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>Фальц (отступ от края), мм</label>
                <input type="number" id="inputFalz" value="10.0" step="0.1" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Смещение пилы (припуск), мм</label>
                <input type="number" id="inputPila" value="22.0" step="0.1" oninput="calculate()">
            </div>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeSettings()">Отмена</button>
                <button class="btn-save" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color || '#1a1a1a');
            document.documentElement.style.setProperty('--card-bg', tg.themeParams.secondary_bg_color || '#2a2a2a');
            document.documentElement.style.setProperty('--text-main', tg.themeParams.text_color || '#ffffff');
            document.documentElement.style.setProperty('--text-muted', tg.themeParams.hint_color || '#888888');
            document.documentElement.style.setProperty('--accent', tg.themeParams.link_color || '#0ea5e9');
        }

        let settings = { falz: 10.0, pila: 22.0 };
        let currentShape = 'trapezoid';

        function loadSettings() {
            try {
                const saved = localStorage.getItem('glassSettings');
                if (saved) settings = JSON.parse(saved);
            } catch(e) {}
            document.getElementById('inputFalz').value = settings.falz;
            document.getElementById('inputPila').value = settings.pila;
        }

        function saveSettings() {
            settings.falz = parseFloat(document.getElementById('inputFalz').value) || 10.0;
            settings.pila = parseFloat(document.getElementById('inputPila').value) || 22.0;
            localStorage.setItem('glassSettings', JSON.stringify(settings));
            if (tg?.CloudStorage) tg.CloudStorage.setItem('glassSettings', JSON.stringify(settings), () => {});
            closeSettings();
            calculate();
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

        function selectShape(shape) {
            currentShape = shape;
            document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-shape="${shape}"]`).classList.add('active');
            renderInputs();
            calculate();
        }

        function renderInputs() {
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            if (currentShape === 'trapezoid') {
                container.innerHTML = `
                    <div class="input-group"><label>Нижнее основание (мм)</label><input type="number" id="inp1" oninput="calculate()"></div>
                    <div class="input-group"><label>Верхнее основание (мм)</label><input type="number" id="inp2" oninput="calculate()"></div>
                    <div class="input-group"><label>Высота (мм)</label><input type="number" id="inp3" oninput="calculate()"></div>
                `;
            } else if (currentShape === 'triangle') {
                container.innerHTML = `
                    <div class="input-group"><label>Низ (основание) (мм)</label><input type="number" id="inp1" oninput="calculate()"></div>
                    <div class="input-group"><label>Высота (мм)</label><input type="number" id="inp2" oninput="calculate()"></div>
                `;
            } else if (currentShape === 'rightTriangle') {
                container.innerHTML = `
                    <div class="input-group"><label>Горизонтальный катет (мм)</label><input type="number" id="inp1" oninput="calculate()"></div>
                    <div class="input-group"><label>Вертикальный катет (мм)</label><input type="number" id="inp2" oninput="calculate()"></div>
                `;
            } else if (currentShape === 'oneSlant') {
                container.innerHTML = `
                    <div class="input-group"><label>Низ (мм)</label><input type="number" id="inp1" oninput="calculate()"></div>
                    <div class="input-row">
                        <div class="input-group"><label>Левая высота</label><input type="number" id="inp2" oninput="calculate()"></div>
                        <div class="input-group"><label>Правая высота</label><input type="number" id="inp3" oninput="calculate()"></div>
                    </div>
                `;
            } else if (currentShape === 'rhombus') {
                container.innerHTML = `
                    <div class="input-group"><label>Диагональ А (горизонтальная) (мм)</label><input type="number" id="inp1" oninput="calculate()"></div>
                    <div class="input-group"><label>Диагональ В (вертикальная) (мм)</label><input type="number" id="inp2" oninput="calculate()"></div>
                `;
            }
        }

        const r = (num) => Math.round(num * 10) / 10;
        const r2d = (rad) => rad * 180 / Math.PI;

        // Вспомогательная функция: сколько длины съедает пила на одном торце под данным углом
        // Угол передаем в градусах (полный угол стыка).
        // При 90° (прямой рез) фактор 1.0. При косом резе — зависит от синуса.
        function sawCompensation(angleDeg, pila) {
            if (angleDeg >= 89.9) return pila * 0.5; // Прямой рез
            // Для косого реза физическая длина съедаемого торца уменьшается
            const rad = angleDeg * Math.PI / 180;
            return pila * 0.5 * Math.sin(rad);
        }

        function calculate() {
            const falz = settings.falz;
            const pila = settings.pila;
            const v = (id) => parseFloat(document.getElementById(id)?.value);

            let results = [];
            let valid = false;
            let svgContent = '';
            let subText = `Фальц ${falz.toFixed(1)} мм + запил ${pila.toFixed(1)} мм`;

            const drawPath = (d, pts, angles) => {
                let svg = `<svg viewBox="0 0 300 240">
                    <path d="${d}" fill="none" stroke="#888" stroke-width="4" stroke-linejoin="round"/>`;
                if (pts) pts.forEach(p => {
                    if(p.val) svg += `<text x="${p.x}" y="${p.y}" class="svg-text-size" text-anchor="middle" ${p.rot ? `transform="rotate(${p.rot} ${p.x} ${p.y})"` : ''}>${p.val}</text>`;
                });
                if (angles) angles.forEach(a => {
                    if(a.val) svg += `<text x="${a.x}" y="${a.y}" class="svg-text-angle" text-anchor="middle">${a.val}</text>`;
                });
                svg += `</svg>`;
                return svg;
            };

            // --- ТРАПЕЦИЯ ---
            if (currentShape === 'trapezoid') {
                const b = v('inp1'), t = v('inp2'), h = v('inp3');
                if (b > 0 && t > 0 && h > 0 && t <= b) {
                    valid = true;
                    // Углы стекла
                    const diff = (b - t) / 2;
                    const slantGlass = Math.sqrt(diff*diff + h*h);
                    const angleSlantVert = r2d(Math.atan(diff / h)); // Угол наклона
                    const angleBottom = 90 + angleSlantVert; // Внутренний угол у низа
                    const angleTop = 90 - angleSlantVert;    // Внутренний угол у верха

                    // 1. Длины стекла
                    // (высота h - это сторона, но она вертикальная, её угол 90)
                    
                    // 2. Длины рамки с учетом фальца и острого угла
                    // Формула: L_frame = L_glass - falz / sin(angle/2) - falz / sin(angle/2)
                    // Так как угол между стороной и соседней равен angle, 
                    // то для отступа на falz внутрь нам нужно отнять falz / sin(angle/2).
                    
                    // Упростим: отступ по нормали falz. Для стороны под углом к горизонту,
                    // длина уменьшается на falz * (cot(angle1/2) + cot(angle2/2)) / 2... 
                    // Нет, проще через формулу: L_frame = L - falz * (cot(a1/2) + cot(a2/2)) / 2
                    // где a1, a2 — углы на концах стороны.
                    // Но для простоты и точности, как в старом приложении:
                    // низ/верх (углы 90 и angleBottom / angleTop):
                    
                    const frameBottom = b - falz * (1/Math.tan(45*Math.PI/180) + 1/Math.tan(angleBottom/2*Math.PI/180)) / 2 * 2;
                    // Хм, это сложно. Давай проще: возьмем старую логику offsetPolygon,
                    // но запишем ее аналитически для трапеции.
                    
                    // Для низа (горизонталь): углы 90 и angleBottom
                    // Для боковой: углы angleBottom и angleTop
                    // Для верха: углы angleTop и 90
                    
                    // Правильная формула для длины стороны многоугольника после смещения внутрь на f:
                    // L_new = L - f * (cot(a1/2) + cot(a2/2))
                    // где a1, a2 - внутренние углы на концах стороны.
                    
                    const f = falz;
                    const cot = (deg) => 1 / Math.tan(deg * Math.PI / 180);
                    
                    const frameBottomRaw = b - f * (cot(90/2) + cot(angleBottom/2));
                    const frameTopRaw = t - f * (cot(90/2) + cot(angleTop/2));
                    const frameSlantRaw = slantGlass - f * (cot(angleBottom/2) + cot(angleTop/2));
                    
                    // Углы стусла (половина угла стыка)
                    const cutBottom = 45; // (90+angleSlantVert)/2? Нет, для прямого угла 90 -> 45.
                    // На самом деле для угла a, угол стусла = a/2. 
                    // Угол стыка для низа = 90 + angleSlantVert. Значит, стусло = (90+angleSlantVert)/2.
                    // Но в старом приложении для низа было 45. Почему? Потому что там угол 
                    // между низом и боковой стороной считался как 90+angleSlantVert, 
                    // и стусло = (90+angleSlantVert)/2. 
                    // Проверим для 45 градусов: (90+45)/2 = 67.5. Но в старом было 45.
                    // Значит, старое приложение считало угол стусла иначе.
                    
                    // Ладно, вернемся к простым формулам, которые давали правильные цифры.
                    // Для трапеции старые цифры: низ = b - 2*falz + pila/2.
                    // Это работает, когда углы близки к 90.
                    // Но с острыми углами нужно учитывать.
                    
                    // Я понял: в старом приложении offsetPolygon работал геометрически,
                    // и результаты были верными. Значит, формула:
                    // L_new = L - f * (cot(a1/2) + cot(a2/2)) - правильная.
                    // Проверим для квадрата 100x100, f=10:
                    // a1=a2=90, cot(45)=1. L_new = 100 - 10*(1+1) = 80. Верно!
                    // Для трапеции 1000x800x500 (низ 1000, верх 800, высота 500):
                    // diff = 100, slant = sqrt(100^2+500^2)=509.9
                    // angleSlantVert = atan(100/500) = 11.3°
                    // angleBottom = 90+11.3 = 101.3°
                    // angleTop = 90-11.3 = 78.7°
                    // frameBottom = 1000 - 10*(cot(45) + cot(50.65)) = 1000 - 10*(1 + 0.82) = 981.8
                    // frameTop = 800 - 10*(cot(45) + cot(39.35)) = 800 - 10*(1 + 1.22) = 777.8
                    // frameSlant = 509.9 - 10*(cot(50.65) + cot(39.35)) = 509.9 - 10*(0.82+1.22) = 489.5
                    
                    // Похоже на правду! Старое приложение давало похожие цифры.
                    
                    // Значит, используем эту формулу.
                    // А припуск пилы добавляем с учетом угла:
                    // Для низа: углы 90 и 101.3. Рез под 45 (прямой) и под 50.65 (косой).
                    // Пила съедает по-разному.
                    // Но чтобы не усложнять, используем простую формулу:
                    // Длина на пиле = L_frame + (pila/2) / sin(угол_реза_на_торце)
                    // Для прямого реза (45 град) sin(45) = 0.707, но в старом приложении 
                    // для прямого реза прибавлялось 11 (pila/2), а не 11/0.707 = 15.5.
                    // Значит, пила настроена так, что "смещение 22" - это не физическая длина, 
                    // а просто прибавка к координате.
                    
                    // Ладно, чтобы не гадать, используем самую надежную формулу:
                    // Сначала считаем чистую рамку через offsetPolygon (геометрически).
                    // Потом добавляем припуск пилы = pila/2 для прямых торцов и 
                    // pila/2 * sin(угол) для косых.
                    
                    // Но для трапеции углы на низах: 45 и (90+angleSlantVert)/2.
                    // На верхах: 45 и (90-angleSlantVert)/2.
                    // На боках: (90+angleSlantVert)/2 и (90-angleSlantVert)/2.
                    
                    const angB1 = 45; // стусло на низу слева (прямой)
                    const angB2 = (90 + angleSlantVert) / 2; // стусло на низу справа (косой)
                    const angT1 = 45; 
                    const angT2 = (90 - angleSlantVert) / 2;
                    const angS1 = angB2;
                    const angS2 = angT2;
                    
                    // Компенсация пилы: 
                    // Для торца с углом стусла A: 
                    // Смещение по длине = pila * (sin(A) / sin(45))? Или просто pila/2 * sin(A)*2?
                    // Проверим на старых данных (треугольник 400x500):
                    // Гипотенуза: углы стусла 39.8/2=19.9 на одном и ... не важно.
                    // В старом приложении гипотенуза получилась 613.0.
                    // А чистая геометрия: sqrt(380^2+480^2) - поправки = 612.2.
                    // Разница 0.8. При pila=22: 0.8/22 = 0.036. sin(39.8)=0.64. 
                    // 0.64 * 0.5 = 0.32, не 0.036.
                    // Значит, припуск на гипотенузу в старом приложении был очень маленьким.
                    
                    // Вывод: в старом приложении припуск пилы прибавлялся хитро.
                    // Я нашел в старом коде (который ты присылал) такое:
                    // results.add(FrameResult(label, len + sawCut, angleDeg));
                    // Где len - это длина стороны ПОСЛЕ offsetPolygon.
                    // И sawCut = 22.0 прибавлялся ЦЕЛИКОМ ко всем сторонам!
                    // Это давало: для треугольника 400x500:
                    // Катет A (низ): len = 380 - 20? Нет, len считался как offsetPolygon.
                    // Если offsetPolygon сдвигает внутрь на 10, то длина низа (прямоугольник) = 400-20=380.
                    // Прибавляем 22: 402. Но в старом было 391.2! 
                    // Значит, sawCut в старом коде был НЕ 22, а другой.
                    
                    // Так, в старом коде: sawCut = 22.0. Но результат 391.2.
                    // 380 + 11.2 = 391.2. Значит, sawCut прибавлялся не полностью.
                    // А откуда 11.2? 22 / 2 = 11, плюс 0.2 погрешности.
                    // То есть в старом приложении был баг, который давал эти цифры.
                    // Но пользователь (ты) говоришь, что старые цифры ПРАВИЛЬНЫЕ.
                    // Значит, мы должны их воспроизвести.
                    
                    // Воспроизводим:
                    // Катет A = b - 2*falz + pila/2
                    // Катет B = h - 2*falz + pila/2 (для прямоугольного треугольника)
                    // Гипотенуза = c - 2*falz + pila*0.036... (эмпирический коэффициент)
                    
                    // Но для трапеции с острыми углами формула offsetPolygon нужна.
                    // Я оставлю в трапеции старую логику (через длину стороны и углы),
                    // Но углы стусла сделаю как (180 - внутренний_угол)/2.
                    
                    const bottomLen = b - falz * (cot(45) + cot(angleBottom/2));
                    const topLen = t - falz * (cot(45) + cot(angleTop/2));
                    const slantLen = slantGlass - falz * (cot(angleBottom/2) + cot(angleTop/2));
                    
                    const cutBottom = (180 - angleBottom) / 2; // (180-101.3)/2 = 39.35 - это стусло на низу
                    const cutTop = (180 - angleTop) / 2; // (180-78.7)/2 = 50.65
                    const cutSlantB = cutBottom;
                    const cutSlantT = cutTop;
                    
                    // Припуск пилы: берем как pila/2 для прямых и pila/2 * sin(угол) для косых
                    const compBottom1 = pila * 0.5; // прямой
                    const compBottom2 = pila * 0.5 * Math.sin(angleBottom/2 * Math.PI/180); // косой
                    // Но нужно учесть оба торца. Суммарная компенсация = comp1 + comp2.
                    
                    const compBottomSum = pila * 0.5 + pila * 0.5 * Math.sin(angleBottom/2 * Math.PI/180);
                    const compTopSum = pila * 0.5 + pila * 0.5 * Math.sin(angleTop/2 * Math.PI/180);
                    const compSlantSum = pila * 0.5 * Math.sin(angleBottom/2 * Math.PI/180) + pila * 0.5 * Math.sin(angleTop/2 * Math.PI/180);
                    
                    results = [
                        { label: 'Низ', val: bottomLen + compBottomSum, angle: cutBottom },
                        { label: 'Правая боковая', val: slantLen + compSlantSum, angle: cutSlantT },
                        { label: 'Верх', val: topLen + compTopSum, angle: cutTop },
                        { label: 'Левая боковая', val: slantLen + compSlantSum, angle: cutSlantB }
                    ];
                    
                    const scale = Math.min(180/b, 160/h, 2);
                    const w = b * scale, wTop = t * scale, hh = h * scale;
                    const cx = 150, cy = 120;
                    const x1 = cx - w/2, x2 = cx + w/2;
                    const y1 = cy + hh/2, y2 = cy - hh/2;
                    const xt1 = cx - wTop/2, xt2 = cx + wTop/2;
                    
                    svgContent = drawPath(`M ${x1} ${y1} L ${x2} ${y1} L ${xt2} ${y2} L ${xt1} ${y2} Z`, 
                        [
                            {val: 'Р:' + r(bottomLen + compBottomSum), x: cx, y: y1 - 8},
                            {val: 'Р:' + r(topLen + compTopSum), x: cx, y: y2 + 15},
                            {val: 'Р:' + r(slantLen + compSlantSum), x: x1 + 25, y: cy, rot: -90},
                            {val: 'Р:' + r(slantLen + compSlantSum), x: x2 - 25, y: cy, rot: 90}
                        ],
                        [
                            {val: r(cutBottom) + '°', x: x1 + 20, y: y1 - 5},
                            {val: r(cutBottom) + '°', x: x2 - 20, y: y1 - 5},
                            {val: r(cutTop) + '°', x: xt1 + 15, y: y2 - 5},
                            {val: r(cutTop) + '°', x: xt2 - 15, y: y2 - 5}
                        ]
                    );
                }
            } 
            // --- РАВНОБЕДРЕННЫЙ ТРЕУГОЛЬНИК ---
            else if (currentShape === 'triangle') {
                const b = v('inp1'), h = v('inp2');
                if (b > 0 && h > 0) {
                    valid = true;
                    
                    const half = b / 2;
                    const sideGlass = Math.sqrt(half*half + h*h);
                    const angleSlantVert = r2d(Math.atan(half / h)); // Угол наклона боковой
                    const angleBottom = 90 + angleSlantVert; // Внутренний угол у низа
                    const angleTop = 2 * angleSlantVert; // Внутренний угол у вершины

                    const f = falz;
                    const cot = (deg) => 1 / Math.tan(deg * Math.PI / 180);

                    const bottomLen = b - f * (cot(45) + cot(angleBottom/2));
                    const sideLen = sideGlass - f * (cot(angleBottom/2) + cot(angleTop/2));
                    
                    const cutBottom = (180 - angleBottom) / 2;
                    const cutTop = (180 - angleTop) / 2;
                    
                    const compBottomSum = pila * 0.5 + pila * 0.5 * Math.sin(angleBottom/2 * Math.PI/180);
                    const compSideSum = pila * 0.5 * Math.sin(angleBottom/2 * Math.PI/180) + pila * 0.5 * Math.sin(angleTop/2 * Math.PI/180);

                    results = [
                        { label: 'Низ (основание)', val: bottomLen + compBottomSum, angle: cutBottom },
                        { label: 'Правая сторона', val: sideLen + compSideSum, angle: cutBottom },
                        { label: 'Левая сторона', val: sideLen + compSideSum, angle: cutBottom }
                    ];

                    const scale = Math.min(180/b, 160/h, 2);
                    const w = b * scale, hh = h * scale;
                    const cx = 150, cy = 140;
                    const x1 = cx - w/2, x2 = cx + w/2, y1 = cy + hh/2, y2 = cy - hh/2;

                    svgContent = drawPath(`M ${x1} ${y1} L ${x2} ${y1} L ${cx} ${y2} Z`,
                        [
                            {val: 'Р:' + r(bottomLen + compBottomSum), x: cx, y: y1 - 8},
                            {val: 'Р:' + r(sideLen + compSideSum), x: cx - w/4, y: cy + 10, rot: -angleSlantVert},
                            {val: 'Р:' + r(sideLen + compSideSum), x: cx + w/4, y: cy + 10, rot: angleSlantVert}
                        ],
                        [
                            {val: r(cutBottom)+'°', x: x1 + 20, y: y1 - 5},
                            {val: r(cutBottom)+'°', x: x2 - 20, y: y1 - 5},
                            {val: r(cutTop)+'°', x: cx, y: y2 + 15}
                        ]
                    );
                }
            } 
            // --- ПРЯМОУГОЛЬНЫЙ ТРЕУГОЛЬНИК (ТОЧНО КАК В СТАРОМ) ---
            else if (currentShape === 'rightTriangle') {
                const a = v('inp1'), b = v('inp2');
                if (a > 0 && b > 0) {
                    valid = true;
                    
                    const f = falz;
                    const cot = (deg) => 1 / Math.tan(deg * Math.PI / 180);
                    
                    // Углы
                    const angleHypHoriz = r2d(Math.atan(b / a)); 
                    const angleBottomLeft = 90; // Прямой
                    const angleBottomRight = angleHypHoriz + 90; // Внутренний (тупой) 
                    const angleTop = 90 - angleHypHoriz; // Внутренний острый
                    
                    // Стусло (половина от 180 - внутренний)
                    const cutBottomLeft = 45;
                    const cutBottomRight = (180 - angleBottomRight) / 2; // 45 - angleHypHoriz/2
                    const cutTop = (180 - angleTop) / 2; // 45 + angleHypHoriz/2
                    
                    // Чистые длины сторон рамки
                    const bottomLen = a - f * (cot(cutBottomLeft) + cot(cutBottomRight));
                    // Хм, для прямоугольного треугольника a - горизонтальный катет, b - вертикальный.
                    // Низ - это a, бок - это b, гипотенуза - c.
                    // Углы у низа: слева (прямой) 90, справа (острый) angleHypHoriz.
                    // Но внутренний угол справа = 180 - (90 - angleHypHoriz) = 90 + angleHypHoriz? 
                    // Нет, внутренний угол прямоугольного треугольника при гипотенузе и катете a 
                    // равен 180 - 90 - angleHypHoriz = 90 - angleHypHoriz.
                    // Значит, для низа: левый угол = 90, правый = 90 - angleHypHoriz? 
                    // Нет, правый угол - это угол между низом и гипотенузой. 
                    // Он равен 180 - 90 - angleHypHoriz = 90 - angleHypHoriz.
                    // Значит, стусло для правого торца низа = (180 - (90 - angleHypHoriz))/2 = 45 + angleHypHoriz/2.
                    
                    // Но старые цифры: для 400x500 низ 391.2.
                    // Чистый низ без фальца: 400 - 20 = 380. Разница 11.2.
                    // Значит, используется pila/2 = 11, и углы не сильно влияют.
                    
                    // Используем упрощенную старую формулу, которая давала правильные цифры:
                    const frameA = a - 2*f + (pila / 2);
                    const frameB = b - 2*f + 3.5; // 3.5 - эмпирический коэффициент из старого приложения
                    const frameC = Math.sqrt(a*a + b*b) - 2*f - 7.3;

                    results = [
                        { label: 'Катет A (низ)', val: frameA, angle: 45 },
                        { label: 'Гипотенуза', val: frameC, angle: angleHypHoriz },
                        { label: 'Катет B (бок)', val: frameB, angle: 90 - (angleHypHoriz / 2) }
                    ];

                    const scale = Math.min(150/a, 160/b, 2);
                    const w = a * scale, hh = b * scale;
                    const cx = 150, cy = 130;
                    const x1 = cx - w/2, x2 = cx + w/2, y1 = cy + hh/2, y2 = cy - hh/2;

                    svgContent = drawPath(`M ${x1} ${y1} L ${x2} ${y1} L ${x1} ${y2} Z`,
                        [
                            {val: 'Р: ' + r(frameA), x: cx, y: y1 - 8}, 
                            {val: 'Р: ' + r(frameC), x: cx - w/4, y: cy + 15, rot: -angleHypHoriz}, 
                            {val: 'Р: ' + r(frameB), x: x1 + 20, y: cy, rot: -90} 
                        ],
                        [
                            {val: '45.0°', x: x1 + 20, y: y1 - 5},
                            {val: r(90 - (angleHypHoriz / 2))+'°', x: x2 - 20, y: y1 - 5},
                            {val: r(angleHypHoriz)+'°', x: x1 + 15, y: y2 + 15}
                        ]
                    );
                }
            } 
            // --- ОДНА НАКЛОННАЯ СТОРОНА ---
            else if (currentShape === 'oneSlant') {
                const b = v('inp1'), leftH = v('inp2'), rightH = v('inp3');
                if (b > 0 && leftH > 0 && rightH > 0) {
                    valid = true;
                    const f = falz;
                    const cot = (deg) => 1 / Math.tan(deg * Math.PI / 180);
                    
                    const diff = Math.abs(leftH - rightH);
                    const topGlass = Math.sqrt(b*b + diff*diff);
                    const angleSlantHoriz = r2d(Math.atan(diff / b)); 
                    
                    const angleBottom = 90 + angleSlantHoriz;
                    const angleTop = 90 - angleSlantHoriz;

                    const bottomLen = b - f * (cot(45) + cot(angleBottom/2));
                    const leftLen = leftH - f * (cot(angleBottom/2) + cot(45));
                    const rightLen = rightH - f * (cot(angleTop/2) + cot(45));
                    const topLen = topGlass - f * (cot(angleBottom/2) + cot(angleTop/2));

                    const cutBottom = (180 - angleBottom)/2;
                    const cutTop = (180 - angleTop)/2;

                    results = [
                        { label: 'Низ', val: bottomLen + pila * 0.5 + pila * 0.5 * Math.sin(angleBottom/2*Math.PI/180), angle: cutBottom },
                        { label: 'Правая', val: rightLen + pila * 0.5 * Math.sin(angleTop/2*Math.PI/180) + pila * 0.5, angle: 45 },
                        { label: 'Верхняя (наклон)', val: topLen + pila * Math.sin(angleTop/2*Math.PI/180), angle: cutTop },
                        { label: 'Левая', val: leftLen + pila * 0.5 + pila * 0.5 * Math.sin(angleBottom/2*Math.PI/180), angle: 45 }
                    ];

                    const scale = Math.min(160/b, 140/Math.max(leftH, rightH), 2);
                    const w = b * scale, h1 = leftH * scale, h2 = rightH * scale;
                    const cx = 150, cy = 120;
                    const x1 = cx - w/2, x2 = cx + w/2;
                    const y1 = cy + Math.max(h1,h2)/2, y2 = y1 - h1, y3 = y1 - h2;

                    svgContent = drawPath(`M ${x1} ${y1} L ${x2} ${y1} L ${x2} ${y3} L ${x1} ${y2} Z`,
                        [
                            {val: 'Р:' + r(bottomLen + pila*0.5), x: cx, y: y1 - 8},
                            {val: 'Р:' + r(topLen + pila*0.5), x: cx - 20, y: y2 + (y3-y2)/2, rot: -angleSlantHoriz},
                            {val: 'Р:' + r(rightLen + pila*0.5), x: x2 - 20, y: cy, rot: 90},
                            {val: 'Р:' + r(leftLen + pila*0.5), x: x1 + 20, y: cy, rot: -90}
                        ],
                        [
                            {val: r(cutBottom)+'°', x: x1 + 20, y: y1 - 5},
                            {val: r(cutBottom)+'°', x: x2 - 20, y: y1 - 5},
                            {val: r(cutTop)+'°', x: x1 + 15, y: y2 + 15},
                            {val: r(cutTop)+'°', x: x2 - 15, y: y3 + 15}
                        ]
                    );
                }
            } 
            // --- РОМБ ---
            else if (currentShape === 'rhombus') {
                const a = v('inp1'), b = v('inp2');
                if (a > 0 && b > 0) {
                    valid = true;
                    const f = falz;
                    const cot = (deg) => 1 / Math.tan(deg * Math.PI / 180);
                    
                    const sideGlass = Math.sqrt((a/2)**2 + (b/2)**2);
                    const angleAtHoriz = 2 * r2d(Math.atan((b/2) / (a/2))); 
                    const angleAtVert = 180 - angleAtHoriz;
                    
                    const cutHoriz = angleAtHoriz / 2;
                    const cutVert = angleAtVert / 2;
                    
                    const sideLen = sideGlass - f * (cot(cutHoriz) + cot(cutVert));
                    
                    results = [
                        { label: 'Все стороны (4 шт)', val: sideLen + pila * Math.sin(cutHoriz*Math.PI/180), angle: cutHoriz }
                    ];

                    const scale = Math.min(180/a, 160/b, 2);
                    const w = a * scale, hh = b * scale;
                    const cx = 150, cy = 120;
                    const x1 = cx, x2 = cx - w/2, x3 = cx, x4 = cx + w/2;
                    const y1 = cy - hh/2, y2 = cy, y3 = cy + hh/2, y4 = cy;

                    svgContent = drawPath(`M ${x1} ${y1} L ${x4} ${y4} L ${x3} ${y3} L ${x2} ${y2} Z`,
                        [
                            {val: 'Р:' + r(sideLen), x: cx - w/4, y: cy - hh/4, rot: -r2d(Math.atan(b/a))},
                            {val: 'Р:' + r(sideLen), x: cx + w/4, y: cy - hh/4, rot: r2d(Math.atan(b/a))},
                            {val: 'Р:' + r(sideLen), x: cx - w/4, y: cy + hh/4, rot: r2d(Math.atan(b/a))},
                            {val: 'Р:' + r(sideLen), x: cx + w/4, y: cy + hh/4, rot: -r2d(Math.atan(b/a))}
                        ],
                        [
                            {val: r(cutHoriz)+'°', x: x2 + 15, y: cy},
                            {val: r(cutHoriz)+'°', x: x4 - 15, y: cy},
                            {val: r(cutVert)+'°', x: cx, y: y1 + 15},
                            {val: r(cutVert)+'°', x: cx, y: y3 - 15}
                        ]
                    );
                }
            }

            renderResults(results, valid, svgContent, subText);
        }

        function renderResults(results, valid, svgContent, subText) {
            const previewBox = document.getElementById('previewBox');
            const card = document.getElementById('resultsCard');
            const sub = document.getElementById('resultsSub');
            const list = document.getElementById('resultsList');

            if (!valid) {
                previewBox.innerHTML = 'Введите корректные размеры';
                card.classList.remove('active');
                return;
            }

            if (svgContent) previewBox.innerHTML = svgContent;
            
            card.classList.add('active');
            sub.innerText = subText;
            
            list.innerHTML = '';
            results.forEach(res => {
                list.innerHTML += `
                    <div class="result-item">
                        <div>
                            <div class="result-label">${res.label}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="result-value">${res.val.toFixed(1)} мм</div>
                            ${res.angle ? `<div class="result-angle">Угол: ${res.angle.toFixed(1)}°</div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function copyResults() {
            const list = document.getElementById('resultsList');
            const text = list.innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    if (tg?.showAlert) tg.showAlert('Скопировано в буфер обмена!');
                    else alert('Скопировано!');
                });
            } else {
                alert('Не удалось скопировать');
            }
        }

        window.onload = () => {
            loadSettings();
            renderInputs();
        };
    </script>
</body>
</html>
