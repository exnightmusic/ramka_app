<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор рамок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
            --text-main: var(--tg-theme-text-color, #ffffff);
            --text-muted: var(--tg-theme-hint-color, #9ca3af);
            --border-color: rgba(148, 163, 184, 0.25);
            --accent: var(--tg-theme-link-color, #0ea5e9);
            --gradient: linear-gradient(135deg, #0ea5e9, #a855f7);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        .header h1 { font-size: 20px; font-weight: 800; margin: 0; }
        .settings-btn { background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; padding: 4px 8px; }

        .shapes-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .shapes-scroll::-webkit-scrollbar { display: none; }
        .shape-btn {
            flex: 0 0 60px; height: 60px; background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; color: var(--text-muted);
        }
        .shape-btn.active { background: rgba(14,165,233,0.12); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(14,165,233,0.25); }
        .shape-btn svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linejoin: round; }

        /* ---------- Превью с полями на фигуре ---------- */
        .preview-box {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; height: 380px; position: relative; overflow: hidden;
            margin-bottom: 12px;
        }
        .preview-box svg.silhouette {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .preview-box svg.silhouette path {
            fill: rgba(148, 163, 184, 0.06);
            stroke: rgba(148, 163, 184, 0.55);
            stroke-width: 2;
            stroke-linejoin: round;
            stroke-dasharray: 6 4;
        }
        .field-overlay {
            position: absolute; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            pointer-events: auto;
        }
        .field-overlay .field-label {
            font-size: 10px; color: var(--text-muted); margin-bottom: 2px;
            white-space: nowrap; font-weight: 600; letter-spacing: 0.3px;
            background: var(--card-bg); padding: 0 4px; border-radius: 4px;
        }
        .field-overlay input {
            width: 74px; height: 32px;
            background: var(--bg-color);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px; font-weight: 700;
            text-align: center;
            padding: 0 6px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
            -moz-appearance: textfield;
        }
        .field-overlay input::-webkit-outer-spin-button,
        .field-overlay input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .field-overlay input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }
        .field-overlay input.filled {
            border-color: rgba(34,197,94,0.5);
        }

        .preview-error {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center; color: var(--danger);
            font-size: 13px; line-height: 1.5;
        }

        /* ---------- Кнопки управления ---------- */
        .controls-row {
            display: flex; justify-content: space-around; align-items: center;
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 10px; margin-bottom: 16px;
        }
        .ctrl-btn {
            background: none; border: none; color: var(--text-main); font-size: 12px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 6px 8px; border-radius: 8px; transition: background 0.2s;
        }
        .ctrl-btn:active { background: rgba(128,128,128,0.15); }
        .ctrl-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .ctrl-btn span { font-size: 10px; color: var(--text-muted); }

        .svg-text-size { font-family: sans-serif; font-size: 13px; font-weight: bold; }
        .svg-angle-badge { font-family: sans-serif; font-size: 9px; fill: var(--warning); font-weight: 600; }
        .svg-angle-circle { fill: rgba(245, 158, 11, 0.18); stroke: rgba(245, 158, 11, 0.55); stroke-width: 1; }

        /* ---------- Результаты ---------- */
        .results-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 18px; display: none;
        }
        .results-card.active { display: block; }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
        .results-title { font-size: 15px; font-weight: bold; color: var(--text-muted); }
        .results-actions { display: flex; gap: 8px; }
        .results-save {
            font-size: 13px; color: var(--success); cursor: pointer; background: none; border: none;
            padding: 4px 8px; border-radius: 6px;
        }
        .results-save.alt { color: var(--accent); }
        .results-save:active { background: rgba(128,128,128,0.15); }

        .results-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(128,128,128,0.1); gap: 10px; }
        .result-item:last-child { border-bottom: none; padding-bottom: 0; }
        .result-item .side-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .result-item .side-label { display: flex; align-items: center; gap: 8px; flex: 1; }
        .result-label { font-size: 14px; color: var(--text-muted); }
        .result-value { font-size: 16px; font-weight: bold; text-align: right; color: var(--text-main); }
        .result-angle { font-size: 11px; color: var(--warning); margin-top: 3px; }

        /* ---------- Модалка ---------- */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); border: 1px solid rgba(128,128,128,0.1); width: 100%; max-width: 340px; border-radius: 20px; padding: 20px; }
        .modal h2 { margin: 0 0 20px 0; font-size: 18px; }
        .modal .input-group { position: relative; margin-bottom: 18px; }
        .modal .input-group label {
            position: absolute; top: -8px; left: 10px; background: var(--card-bg);
            padding: 0 4px; font-size: 12px; color: var(--text-muted);
        }
        .modal .input-group input {
            width: 100%; background: transparent; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 16px;
            outline: none; font-family: inherit;
        }
        .modal .input-group input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
        .btn-text { background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 8px 12px; }
        .btn-save { background: var(--gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Калькулятор рамок</h1>
        <button class="settings-btn" onclick="openSettings()">⋮</button>
    </div>

    <div class="shapes-scroll" id="shapesContainer">
        <div class="shape-btn active" data-shape="trapezoid" onclick="selectShape('trapezoid')">
            <svg viewBox="0 0 24 24"><path d="M4 6 L20 6 L16 18 L8 18 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="triangle" onclick="selectShape('triangle')">
            <svg viewBox="0 0 24 24"><path d="M12 4 L20 20 L4 20 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="rightTriangle" onclick="selectShape('rightTriangle')">
            <svg viewBox="0 0 24 24"><path d="M4 4 L4 20 L20 20 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="oneSlant" onclick="selectShape('oneSlant')">
            <svg viewBox="0 0 24 24"><path d="M4 6 L16 6 L20 18 L4 18 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="rhombus" onclick="selectShape('rhombus')">
            <svg viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="pentagon" onclick="selectShape('pentagon')">
            <svg viewBox="0 0 24 24"><path d="M4 10 L12 4 L20 10 L20 20 L4 20 Z"/></svg>
        </div>
        <div class="shape-btn" data-shape="rectCut" onclick="selectShape('rectCut')">
            <svg viewBox="0 0 24 24"><path d="M4 4 L14 4 L20 10 L20 20 L4 20 Z"/></svg>
        </div>
    </div>

    <div class="preview-box" id="previewBox"></div>

    <div class="controls-row">
        <button class="ctrl-btn" onclick="rotateShape(-90)" title="Повернуть влево">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
            <span>Влево</span>
        </button>
        <button class="ctrl-btn" onclick="rotateShape(90)" title="Повернуть вправо">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/></svg>
            <span>Вправо</span>
        </button>
        <button class="ctrl-btn" onclick="mirrorShape()" title="Отразить">
            <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7L3 12l5 5"/><path d="M16 7l5 5-5 5"/></svg>
            <span>Зеркало</span>
        </button>
        <button class="ctrl-btn" onclick="resetShape()" title="Сбросить">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v5h5"/></svg>
            <span>Сброс</span>
        </button>
    </div>

    <div class="results-card" id="resultsCard">
        <div class="results-header">
            <div class="results-title">Размеры рамки</div>
            <div class="results-actions">
                <button class="results-save" onclick="copyResults()">Копировать</button>
                <button class="results-save alt" onclick="shareResults()">Поделиться</button>
            </div>
        </div>
        <div class="results-sub" id="resultsSub"></div>
        <div id="resultsList"></div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>Настройки калькулятора</h2>
            <div class="input-group">
                <label>Фальц (отступ от края), мм</label>
                <input type="number" id="inputFalz" value="10.0" step="0.1" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Отступ пилы (добавка), мм</label>
                <input type="number" id="inputPila" value="22.0" step="0.1" oninput="calculate()">
            </div>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeSettings()">Отмена</button>
                <button class="btn-save" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color || '#1a1a1a');
            document.documentElement.style.setProperty('--card-bg', tg.themeParams.secondary_bg_color || '#2a2a2a');
            document.documentElement.style.setProperty('--text-main', tg.themeParams.text_color || '#ffffff');
            document.documentElement.style.setProperty('--text-muted', tg.themeParams.hint_color || '#9ca3af');
            document.documentElement.style.setProperty('--accent', tg.themeParams.link_color || '#0ea5e9');
        }

        let settings = { falz: 10.0, pila: 22.0 };
        let currentShape = 'trapezoid';
        let rotation = 0;
        let mirror = false;

        const SIDE_COLORS = ['#22c55e', '#0ea5e9', '#a855f7', '#f59e0b', '#ef4444', '#14b8a6'];

        // ============================================================
        //  КОНФИГУРАЦИЯ ФИГУР
        //  Для каждой фигуры:
        //    - inputs: список полей (id, label, позиция x/y на "шаблоне" 0..1)
        //    - outlineTemplate: силуэт (path в SVG, viewBox 300x340) для шаблона
        //    - build: функция построения полигона из введённых значений
        // ============================================================

        const SHAPES = {
            trapezoid: {
                labels: ['Низ', 'Правая', 'Верх', 'Левая'],
                fields: [
                    { id: 'inp1', label: 'Низ',    x: 0.50, y: 0.93 },
                    { id: 'inp2', label: 'Верх',   x: 0.50, y: 0.10 },
                    { id: 'inp3', label: 'Высота', x: 0.90, y: 0.50 }
                ],
                template: 'M60 80 L240 80 L210 270 L90 270 Z',
                build(v) {
                    const b = v('inp1'), t = v('inp2'), h = v('inp3');
                    if (!(b > 0 && t > 0 && h > 0)) return null;
                    const diff = (b - t) / 2;
                    return {
                        poly: [{x:0,y:0},{x:b,y:0},{x:b-diff,y:h},{x:diff,y:h}],
                        labels: this.labels
                    };
                }
            },
            triangle: {
                labels: ['Низ', 'Правая', 'Левая'],
                fields: [
                    { id: 'inp1', label: 'Низ',    x: 0.50, y: 0.93 },
                    { id: 'inp2', label: 'Высота', x: 0.90, y: 0.50 }
                ],
                template: 'M150 70 L250 270 L50 270 Z',
                build(v) {
                    const b = v('inp1'), h = v('inp2');
                    if (!(b > 0 && h > 0)) return null;
                    return {
                        poly: [{x:0,y:0},{x:b,y:0},{x:b/2,y:h}],
                        labels: this.labels
                    };
                }
            },
            rightTriangle: {
                labels: ['Катет A', 'Катет B', 'Гипотенуза'],
                fields: [
                    { id: 'inp1', label: 'Низ', x: 0.50, y: 0.93 },
                    { id: 'inp2', label: 'Бок', x: 0.10, y: 0.50 }
                ],
                template: 'M70 70 L70 270 L250 270 Z',
                build(v) {
                    const a = v('inp1'), b = v('inp2');
                    if (!(a > 0 && b > 0)) return null;
                    return {
                        poly: [{x:0,y:0},{x:a,y:0},{x:0,y:b}],
                        labels: this.labels
                    };
                }
            },
            oneSlant: {
                labels: ['Низ', 'Правая', 'Верхняя (наклон)', 'Левая'],
                fields: [
                    { id: 'inp1', label: 'Низ',        x: 0.50, y: 0.93 },
                    { id: 'inp2', label: 'Левая выс.', x: 0.10, y: 0.35 },
                    { id: 'inp3', label: 'Правая выс.', x: 0.90, y: 0.50 }
                ],
                template: 'M70 100 L230 100 L250 270 L70 270 Z',
                build(v) {
                    const b = v('inp1'), lh = v('inp2'), rh = v('inp3');
                    if (!(b > 0 && lh > 0 && rh > 0)) return null;
                    return {
                        poly: [{x:0,y:0},{x:b,y:0},{x:b,y:rh},{x:0,y:lh}],
                        labels: this.labels
                    };
                }
            },
            rhombus: {
                labels: ['Сторона 1', 'Сторона 2', 'Сторона 3', 'Сторона 4'],
                fields: [
                    { id: 'inp1', label: 'Диаг. А', x: 0.90, y: 0.50 },
                    { id: 'inp2', label: 'Диаг. В', x: 0.50, y: 0.07 }
                ],
                template: 'M150 50 L260 170 L150 290 L40 170 Z',
                build(v) {
                    const a = v('inp1'), b = v('inp2');
                    if (!(a > 0 && b > 0)) return null;
                    return {
                        poly: [{x:a/2,y:0},{x:a,y:b/2},{x:a/2,y:b},{x:0,y:b/2}],
                        labels: this.labels
                    };
                }
            },
            pentagon: {
                labels: ['Низ', 'Правая', 'Верх', 'Скос', 'Левая'],
                fields: [
                    { id: 'inp1', label: 'Низ',        x: 0.50, y: 0.93 },
                    { id: 'inp2', label: 'Верх',       x: 0.50, y: 0.10 },
                    { id: 'inp3', label: 'Левая выс.', x: 0.08, y: 0.50 },
                    { id: 'inp4', label: 'Правая выс.',x: 0.92, y: 0.50 },
                    { id: 'inp5', label: 'Скос',       x: 0.75, y: 0.18 }
                ],
                template: 'M80 90 L220 90 L250 270 L50 270 Z',
                build(v) {
                    const bot = v('inp1'), top = v('inp2'), lh = v('inp3'), rh = v('inp4'), shift = v('inp5');
                    if (!(bot > 0 && top > 0 && lh > 0 && rh > 0)) return null;
                    const offset = (bot - top - shift) / 2;
                    return {
                        poly: [
                            {x: 0, y: 0},
                            {x: bot, y: 0},
                            {x: bot, y: rh},
                            {x: shift + offset, y: lh},
                            {x: offset, y: lh}
                        ],
                        labels: this.labels
                    };
                }
            },
            rectCut: {
                labels: ['Низ', 'Правая (до среза)', 'Срез', 'Верх', 'Левая'],
                fields: [
                    { id: 'inp1', label: 'Низ',          x: 0.45, y: 0.93 },
                    { id: 'inp2', label: 'Левая стор.',  x: 0.08, y: 0.50 },
                    { id: 'inp3', label: 'Правая стор.', x: 0.92, y: 0.62 },
                    { id: 'inp4', label: 'Верх',         x: 0.38, y: 0.10 }
                ],
                template: 'M70 70 L190 70 L250 130 L250 270 L70 270 Z',
                build(v) {
                    const bot = v('inp1'), leftH = v('inp2'), rightH = v('inp3'), top = v('inp4');
                    if (!(bot > 0 && leftH > 0 && rightH > 0 && top > 0)) return null;
                    if (top > bot) return { error: `Верх (${top}) не может быть больше низа (${bot}).` };
                    if (rightH >= leftH) return { error: `Правая сторона (${rightH}) должна быть меньше левой (${leftH}).` };
                    return {
                        poly: [
                            {x: 0, y: 0},
                            {x: bot, y: 0},
                            {x: bot, y: rightH},
                            {x: top, y: leftH},
                            {x: 0, y: leftH}
                        ],
                        labels: this.labels
                    };
                }
            }
        };

        // ---------- Настройки ----------
        function loadSettings() {
            try {
                const saved = localStorage.getItem('glassSettings');
                if (saved) settings = JSON.parse(saved);
            } catch(e) {}
            document.getElementById('inputFalz').value = settings.falz;
            document.getElementById('inputPila').value = settings.pila;
        }
        function saveSettings() {
            settings.falz = parseFloat(document.getElementById('inputFalz').value) || 10.0;
            settings.pila = parseFloat(document.getElementById('inputPila').value) || 22.0;
            localStorage.setItem('glassSettings', JSON.stringify(settings));
            if (tg?.CloudStorage) tg.CloudStorage.setItem('glassSettings', JSON.stringify(settings), () => {});
            closeSettings();
            calculate();
        }
        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

        // ---------- Сохранение состояния ----------
        function persistState() {
            const data = { shape: currentShape, rotation, mirror, inputs: {} };
            document.querySelectorAll('.field-overlay input').forEach(inp => {
                data.inputs[inp.id] = inp.value;
            });
            try { localStorage.setItem('glassLastCalc', JSON.stringify(data)); } catch(e) {}
        }
        function restoreState() {
            try {
                const last = JSON.parse(localStorage.getItem('glassLastCalc') || 'null');
                if (!last) return false;
                if (last.shape && SHAPES[last.shape]) {
                    currentShape = last.shape;
                    rotation = last.rotation || 0;
                    mirror = !!last.mirror;
                    document.querySelectorAll('.shape-btn').forEach(b =>
                        b.classList.toggle('active', b.dataset.shape === currentShape));
                }
                return true;
            } catch(e) { return false; }
        }
        function restoreInputs() {
            try {
                const last = JSON.parse(localStorage.getItem('glassLastCalc') || 'null');
                if (!last?.inputs) return;
                Object.entries(last.inputs).forEach(([id, val]) => {
                    const el = document.getElementById(id);
                    if (el) el.value = val;
                });
            } catch(e) {}
        }

        // ---------- Выбор фигуры ----------
        function selectShape(shape) {
            currentShape = shape;
            rotation = 0;
            mirror = false;
            document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-shape="${shape}"]`).classList.add('active');
            renderShape();
        }
        function rotateShape(deg) { rotation = (rotation + deg + 360) % 360; calculate(); }
        function mirrorShape() { mirror = !mirror; calculate(); }
        function resetShape() {
            rotation = 0;
            mirror = false;
            document.querySelectorAll('.field-overlay input').forEach(inp => inp.value = '');
            calculate();
        }

        // ============================================================
        //  РЕНДЕР ПРЕВЬЮ: шаблон + поля ввода поверх
        // ============================================================
        function renderShape() {
            const box = document.getElementById('previewBox');
            const cfg = SHAPES[currentShape];
            if (!cfg) { box.innerHTML = ''; return; }

            let html = `<svg class="silhouette" viewBox="0 0 300 340" preserveAspectRatio="xMidYMid meet">
                <path d="${cfg.template}"/>
            </svg>`;

            cfg.fields.forEach(f => {
                html += `<div class="field-overlay" style="left:${f.x*100}%; top:${f.y*100}%">
                    <div class="field-label">${f.label}</div>
                    <input type="number" id="${f.id}" inputmode="decimal" placeholder="мм" oninput="calculate()">
                </div>`;
            });

            box.innerHTML = html;

            // Восстанавливаем значения полей
            restoreInputs();
            calculate();
        }

        // ============================================================
        //  ГЕОМЕТРИЯ
        // ============================================================
        const r = (num) => Math.round(num * 10) / 10;

        function lineIntersection(p1, p2, p3, p4) {
            const a1 = p2.y - p1.y, b1 = p1.x - p2.x, c1 = a1 * p1.x + b1 * p1.y;
            const a2 = p4.y - p3.y, b2 = p3.x - p4.x, c2 = a2 * p3.x + b2 * p3.y;
            const det = a1 * b2 - a2 * b1;
            if (Math.abs(det) < 1e-6) return null;
            return { x: (b2 * c1 - b1 * c2) / det, y: (a1 * c2 - a2 * c1) / det };
        }

        function offsetPolygon(poly, offset) {
            if (poly.length < 3) return null;
            let area = 0;
            for (let i = 0; i < poly.length; i++) {
                const j = (i + 1) % poly.length;
                area += poly[i].x * poly[j].y - poly[j].x * poly[i].y;
            }
            const isCCW = area > 0;
            const shiftedLines = [];
            for (let i = 0; i < poly.length; i++) {
                const p1 = poly[i], p2 = poly[(i + 1) % poly.length];
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len === 0) return null;
                const nx = isCCW ? dy / len : -dy / len;
                const ny = isCCW ? -dx / len : dx / len;
                const shift = isCCW ? -offset : offset;
                shiftedLines.push({
                    p1: { x: p1.x + nx * shift, y: p1.y + ny * shift },
                    p2: { x: p2.x + nx * shift, y: p2.y + ny * shift }
                });
            }
            const newPoly = [];
            for (let i = 0; i < poly.length; i++) {
                const prevIdx = (i - 1 + poly.length) % poly.length;
                const intersect = lineIntersection(
                    shiftedLines[prevIdx].p1, shiftedLines[prevIdx].p2,
                    shiftedLines[i].p1, shiftedLines[i].p2
                );
                if (intersect) newPoly.push(intersect);
                else return null;
            }
            return newPoly;
        }

        function transformPoly(poly) {
            let p = poly;
            if (mirror) {
                const minX = Math.min(...p.map(pt => pt.x));
                const maxX = Math.max(...p.map(pt => pt.x));
                p = p.map(pt => ({ x: maxX + minX - pt.x, y: pt.y }));
            }
            if (rotation !== 0) {
                const minX = Math.min(...p.map(pt => pt.x));
                const maxX = Math.max(...p.map(pt => pt.x));
                const minY = Math.min(...p.map(pt => pt.y));
                const maxY = Math.max(...p.map(pt => pt.y));
                const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
                const rad = rotation * Math.PI / 180;
                const cosA = Math.cos(rad), sinA = Math.sin(rad);
                p = p.map(pt => {
                    const dx = pt.x - cx, dy = pt.y - cy;
                    return { x: cx + dx * cosA - dy * sinA, y: cy + dx * sinA + dy * cosA };
                });
            }
            return p;
        }

        // ============================================================
        //  РАСЧЁТ
        // ============================================================
        function calculate() {
            const falz = settings.falz;
            const pila = settings.pila;
            const v = (id) => parseFloat(document.getElementById(id)?.value);
            const cfg = SHAPES[currentShape];

            // Подсветка заполненных полей
            if (cfg) {
                cfg.fields.forEach(f => {
                    const el = document.getElementById(f.id);
                    if (el) el.classList.toggle('filled', !!el.value);
                });
            }

            const subText = `Фальц: ${falz.toFixed(1)} мм + добавка: ${pila.toFixed(1)} мм`;
            const built = cfg ? cfg.build(v) : null;

            if (!built) {
                // не все поля заполнены — показываем шаблон
                renderResults([], false, '', subText);
                persistState();
                return;
            }

            if (built.error) {
                showPreviewError(built.error);
                renderResults([], false, '', subText);
                persistState();
                return;
            }

            const rawPoly = built.poly;
            const labels = built.labels;

            const innerPoly = offsetPolygon(rawPoly, falz);
            if (!innerPoly) {
                showPreviewError('Ошибка геометрии — слишком большой фальц или некорректные размеры.');
                renderResults([], false, '', subText);
                persistState();
                return;
            }

            const transformedInner = transformPoly(innerPoly);
            const transformedOuter = transformPoly(rawPoly);

            // Считаем длины и углы
            const results = [];
            const N = innerPoly.length;
            for (let i = 0; i < N; i++) {
                const p1 = innerPoly[i], p2 = innerPoly[(i + 1) % N];
                const len = Math.sqrt((p2.x - p1.x)**2 + (p2.y - p1.y)**2);

                const p_prev = innerPoly[(i - 1 + N) % N];
                const p_next = innerPoly[(i + 2) % N];
                const v1 = {x: p1.x - p_prev.x, y: p1.y - p_prev.y};
                const v2 = {x: p2.x - p1.x, y: p2.y - p1.y};
                const a1 = Math.atan2(v1.y, v1.x);
                const a2 = Math.atan2(v2.y, v2.x);
                let diff = (a1 - a2) * 180 / Math.PI;
                if (diff < 0) diff += 360;
                if (diff > 180) diff = 360 - diff;

                results.push({
                    label: labels[i] || `Сторона ${i+1}`,
                    val: len + pila,
                    angle: Math.abs(180 - diff) / 2,
                    color: SIDE_COLORS[i % SIDE_COLORS.length]
                });
            }

            // Отрисовка результата поверх шаблона — фигура заменяет силуэт
            const svgContent = buildResultSvg(transformedOuter, transformedInner, results, N);
            renderResults(results, true, svgContent, subText);
            persistState();
        }

        function showPreviewError(text) {
            const box = document.getElementById('previewBox');
            const existing = box.querySelector('.preview-error');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'preview-error';
            div.innerText = '⚠️ ' + text;
            box.appendChild(div);
        }

        function buildResultSvg(outer, inner, results, N) {
            const VB_W = 300, VB_H = 340;
            const allPts = [...outer, ...inner];
            const minX = Math.min(...allPts.map(p => p.x));
            const maxX = Math.max(...allPts.map(p => p.x));
            const minY = Math.min(...allPts.map(p => p.y));
            const maxY = Math.max(...allPts.map(p => p.y));

            const wBox = Math.max(maxX - minX, 1);
            const hBox = Math.max(maxY - minY, 1);
            const usableW = VB_W * 0.72;
            const usableH = VB_H * 0.72;
            const scale = Math.min(usableW / wBox, usableH / hBox);

            const cx = VB_W / 2 - ((minX + maxX) / 2) * scale;
            const cy = VB_H / 2 + ((minY + maxY) / 2) * scale;
            const toSvg = (p) => ({ x: p.x * scale + cx, y: -p.y * scale + cy });

            const maxSide = Math.max(wBox, hBox);
            const labelOffset = Math.max(16, Math.min(38, 220 / maxSide * 22));

            let pathStr = "";
            outer.forEach((p, i) => {
                const pt = toSvg(p);
                pathStr += (i === 0 ? "M" : "L") + ` ${pt.x} ${pt.y} `;
            });
            pathStr += "Z";

            let svg = `<svg class="silhouette" viewBox="0 0 ${VB_W} ${VB_H}" style="opacity:1">
                <path d="${pathStr}" style="fill:none;stroke:#888;stroke-width:3;stroke-dasharray:none"/>`;

            // Углы
            for (let i = 0; i < N; i++) {
                const pt = toSvg(inner[i]);
                const dx = VB_W / 2 - pt.x, dy = VB_H / 2 - pt.y;
                const dd = Math.sqrt(dx*dx + dy*dy) || 1;
                const bx = pt.x + (dx / dd) * 14;
                const by = pt.y + (dy / dd) * 14;
                if (results[i].angle > 1) {
                    svg += `<circle cx="${bx}" cy="${by}" r="9" class="svg-angle-circle"/>
                            <text x="${bx}" y="${by + 3}" text-anchor="middle" class="svg-angle-badge">${Math.round(results[i].angle)}°</text>`;
                }
            }

            // Подписи размеров
            for (let i = 0; i < N; i++) {
                const p1 = toSvg(inner[i]);
                const p2 = toSvg(inner[(i + 1) % N]);
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;

                const outX = midX - VB_W / 2, outY = midY - VB_H / 2;
                const d = Math.sqrt(outX*outX + outY*outY) || 1;
                const textX = midX + (outX / d) * labelOffset;
                const textY = midY + (outY / d) * labelOffset;

                let angleDeg = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
                if (angleDeg > 90) angleDeg -= 180;
                if (angleDeg < -90) angleDeg += 180;

                svg += `<text x="${textX}" y="${textY}" text-anchor="middle"
                          transform="rotate(${angleDeg} ${textX} ${textY})"
                          class="svg-text-size" fill="${results[i].color}">${r(results[i].val)}</text>`;
            }
            svg += `</svg>`;
            return svg;
        }

        function renderResults(results, valid, svgContent, subText) {
            const box = document.getElementById('previewBox');
            const card = document.getElementById('resultsCard');
            const sub = document.getElementById('resultsSub');
            const list = document.getElementById('resultsList');

            if (!valid) {
                card.classList.remove('active');
                return;
            }

            // Заменяем силуэт на реальную фигуру
            const oldSil = box.querySelector('svg.silhouette');
            if (oldSil) oldSil.remove();
            if (svgContent) box.insertAdjacentHTML('afterbegin', svgContent);

            card.classList.add('active');
            sub.innerText = subText;

            list.innerHTML = '';
            results.forEach(res => {
                list.innerHTML += `
                    <div class="result-item">
                        <div class="side-label">
                            <span class="side-dot" style="background:${res.color}"></span>
                            <span class="result-label">${res.label}</span>
                        </div>
                        <div style="text-align: right;">
                            <div class="result-value">${res.val.toFixed(1)} мм</div>
                            ${res.angle > 1 ? `<div class="result-angle">Угол: ${res.angle.toFixed(1)}°</div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        // ---------- Копирование / шаринг ----------
        function copyResults() {
            const list = document.getElementById('resultsList');
            const text = list.innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    if (tg?.showAlert) tg.showAlert('Скопировано в буфер обмена!');
                    else alert('Скопировано!');
                });
            } else {
                alert('Не удалось скопировать');
            }
        }
        function shareResults() {
            const sub = document.getElementById('resultsSub').innerText;
            const list = document.getElementById('resultsList').innerText;
            const text = `📐 Размеры рамки\n${sub}\n\n${list}`;

            if (tg?.showPopup) {
                const url = `https://t.me/share/url?url=${encodeURIComponent('Калькулятор рамок')}&text=${encodeURIComponent(text)}`;
                tg.openTelegramLink(url);
            } else if (navigator.share) {
                navigator.share({ title: 'Размеры рамки', text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Скопировано!');
            }
        }

        // ---------- Старт ----------
        window.onload = () => {
            loadSettings();
            const restored = restoreState();
            renderShape();
            if (restored) restoreInputs();
            calculate();
        };
    </script>
</body>
</html>
